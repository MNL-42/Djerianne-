<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050a12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>MNL OS</title>
<style>
:root{--g:#00e0a4;--b:#2e86ff;--bg:#050a12;--p:rgba(8,17,28,.82);--ln:#16314a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#cfe;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
#rain,#three{position:absolute;inset:0;width:100%;height:100%}
#three{display:none}#three canvas{display:block}
button{font:inherit;color:#cfe;background:#0b1a2a;border:1px solid var(--ln);border-radius:10px;padding:8px 11px;font-size:13px}
button:active{background:#12304a}
/* ---------- écran de verrouillage ---------- */
#lock{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;color:#fff;
  padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 22px);transition:transform .35s ease;touch-action:none}
#lock .top{font-size:22px;margin-top:8px}
#ldate{margin-top:10px;font-size:19px;color:#bfe;text-transform:capitalize}
#ltime{font-size:26vw;line-height:1;font-weight:700;letter-spacing:-2px;margin-top:4px;text-shadow:0 0 30px rgba(0,224,164,.55);color:#eafff8}
#lsub{margin-top:14px;color:var(--g);letter-spacing:3px;font-size:13px}
#lbat{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);font-size:13px;color:var(--g)}
.lbottom{margin-top:auto;text-align:center;color:#9cd;font-size:13px}
.lbottom i{display:block;width:130px;height:5px;border-radius:3px;background:#fff;margin:0 auto 12px;opacity:.8;animation:up 1.6s ease-in-out infinite}
@keyframes up{50%{transform:translateY(-8px);opacity:.3}}
/* ---------- IDE ---------- */
#ide{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 6px 30px}
#top{display:flex;gap:6px;padding:6px 0;align-items:center}
#files{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none}
#files::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 12px;font-size:13px;background:var(--p);border:1px solid var(--ln);border-radius:10px;color:#7fa0b8}
.tab.on{color:#fff;border-color:var(--g);box-shadow:0 0 10px rgba(0,224,164,.35)}
#tools{display:flex;gap:6px;padding-bottom:6px;overflow-x:auto;scrollbar-width:none}
#tools button{flex:0 0 auto}
#run{background:var(--g);color:#04121a;font-weight:700;border-color:var(--g)}
#edwrap{position:relative;flex:1;min-height:0;background:rgba(3,7,16,.78);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
#hl,#ta{position:absolute;inset:0;margin:0;padding:10px 10px 90px;border:0;font:14px/20px ui-monospace,Menlo,Consolas,monospace;tab-size:4;white-space:pre;letter-spacing:0;word-spacing:0}
#hl{overflow:hidden;pointer-events:none;color:#d6efe6}
#ta{width:100%;height:100%;overflow:auto;background:transparent;color:transparent;caret-color:var(--g);outline:0;resize:none}
#ta::selection{background:rgba(46,134,255,.45)}
.k{color:#ff7ab2}.s{color:#ffd479}.f{color:#6cb6ff}.c{color:#5c7a92}.n{color:#b794f6}
#keys{display:flex;gap:5px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
#keys::-webkit-scrollbar{display:none}
#keys button{flex:0 0 auto;min-width:40px;padding:9px 8px;font-size:15px}
#out{display:none;flex-direction:column;height:44%;margin:0 0 6px;background:rgba(3,7,16,.92);border:1px solid var(--ln);border-radius:12px;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
#otabs{display:flex;gap:6px;padding:6px;background:#08111c;border-bottom:1px solid var(--ln)}
#otabs .on{border-color:var(--g);color:#fff}
#frame{flex:1;min-height:0;width:100%;border:0;background:#fff}
#con{flex:1;min-height:0;margin:0;padding:10px;overflow:auto;font-size:13px;line-height:1.5;color:var(--g);white-space:pre-wrap;display:none}
#con .err{color:#ff7a7a}#con .warn{color:#ffd479}#con .sys{color:#6b8aa3}
/* ---- verre (liquid glass) ---- */
button,.tab{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.3);backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);color:#e8fff8}
button:active{background:rgba(255,255,255,.2)}
#run{background:linear-gradient(135deg,rgba(0,224,164,.85),rgba(0,160,255,.7));color:#03131c;border-color:rgba(255,255,255,.4)}
.tab.on{background:rgba(0,224,164,.22);border-color:rgba(0,224,164,.7)}
#edwrap,#out{background:rgba(6,14,26,.42);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
#otabs{background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.15)}
#otabs .on{background:rgba(0,224,164,.22)}
/* ---- écran verrouillé style iPhone 17 ---- */
#ldate{font-size:20px;font-weight:500;color:rgba(255,255,255,.88);margin-top:8px}
#lock .top{font-size:20px;opacity:.9}
.glass{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px rgba(0,0,0,.35);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%)}
.notif{width:calc(100% - 32px);max-width:420px;margin-top:22px;padding:13px 16px;border-radius:22px;display:flex;flex-direction:column;gap:3px;text-align:left;color:#fff}
.notif b{font-size:12px;color:var(--g);letter-spacing:1.5px}.notif span{font-size:14px;color:rgba(255,255,255,.88)}
.lbottom{width:100%;padding:0 34px}
.lrow{display:flex;justify-content:space-between;margin-bottom:16px}
.gb{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.hint{display:block;font-size:12px;opacity:.7;margin-bottom:12px}
.lbottom i{width:134px;height:5px;margin:0 auto;animation:none;opacity:.9}
/* ---- icônes, puce système, horloge géante ---- */
button{display:inline-flex;align-items:center;justify-content:center}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-right:6px;flex:0 0 auto}
button .ic:only-child{margin-right:0}
.gb .ic{width:24px;height:24px;margin:0;color:#fff}
.chip{margin-top:6px;padding:6px 14px;border-radius:99px;font-size:11px;letter-spacing:2px;color:#cfe;display:flex;align-items:center;gap:8px}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.3}}
#ltime{display:flex;flex-direction:column;align-items:center;font:700 min(48vw,26vh)/.82 ui-rounded,"SF Pro Rounded",system-ui,Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:8px 0 0;text-shadow:none;filter:drop-shadow(0 10px 34px rgba(0,224,164,.35))}
#ltime span{padding:.06em .04em;margin:-.06em 0;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(190,255,235,.16));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.6)}
/* ---- OS : fenêtres, accueil, applis ---- */
.win{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;opacity:0;transform:scale(.97);transition:opacity .22s,transform .22s,visibility 0s .22s}
.win.show{visibility:visible;opacity:1;transform:none;transition:opacity .22s,transform .22s}
#home{padding:calc(env(safe-area-inset-top) + 8px) 18px 40px}
#sb{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#fff;padding:6px 6px 0;letter-spacing:.5px}
#wid{margin:18px 0 26px;padding:18px 22px;border-radius:30px;color:#fff}
#wt{font:700 68px/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;letter-spacing:-.03em;filter:drop-shadow(0 4px 18px rgba(0,224,164,.35))}
#wd{margin-top:6px;opacity:.8;text-transform:capitalize;font-size:15px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
#dock{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 8px;border-radius:32px}
.ap{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#e8fff8;cursor:pointer;user-select:none}
.ap i{width:60px;height:60px;border-radius:19px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--c),rgba(255,255,255,.05))}
.ap:active i{transform:scale(.92)}
.ap .ic{width:28px;height:28px;margin:0;color:#fff}
.app{padding:calc(env(safe-area-inset-top) + 10px) 14px 36px;background:rgba(4,9,18,.5);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}
.wh{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.wh b{font-size:20px;font-weight:600;letter-spacing:1px;color:#fff}
.wb{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.sec{margin:14px 4px 0;font-size:11px;letter-spacing:2px;color:var(--g)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;font-size:14px;color:#e8fff8;flex:0 0 auto}
.row small{display:block;margin-top:3px;font-size:11px;color:#8fd;opacity:.7}
.row input[type=range]{width:44%;accent-color:#00e0a4}
.row input[type=number],.row input[type=text]{width:80px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px;font:inherit}
.seg{display:flex;gap:6px}.seg button.on,.bar button.on{background:rgba(0,224,164,.3);border-color:var(--g)}
.bar{display:flex;gap:8px;flex:0 0 auto;align-items:center}
.empty{margin:40px auto;text-align:center;opacity:.6;line-height:1.6}
.big{font:700 54px/1.1 ui-rounded,system-ui,sans-serif;text-align:right;color:#fff;padding:14px 6px;word-break:break-all;flex:0 0 auto}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:auto}
.ck button{padding:20px 0;font-size:24px;border-radius:22px}.ck .eq{background:linear-gradient(135deg,rgba(0,224,164,.85),rgba(0,160,255,.7));color:#03131c}
.nt{flex:1;min-height:200px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:18px;color:#fff;padding:14px;font:15px/1.6 system-ui,sans-serif;resize:none;outline:0}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.gg img,.gg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#000}
#gv{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 36px;background:rgba(0,0,0,.94)}
#gv img,#gv video{flex:1;min-height:0;width:100%;object-fit:contain}
#w-cam{padding:0;background:#000;backdrop-filter:none;-webkit-backdrop-filter:none}
#w-cam .wh{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;padding:0}
#w-cam .wb{position:absolute;inset:0;display:block;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;transition:opacity .12s}
#cmsg{position:absolute;top:45%;left:0;right:0;text-align:center;color:#fff;opacity:.85;padding:0 30px;white-space:pre-line}
#camui{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:space-around;align-items:center}
.shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.28);box-shadow:0 0 24px rgba(0,224,164,.5)}
.shut:active{background:rgba(255,255,255,.7)}
#cthumb{width:54px;height:54px;border-radius:14px;background-size:cover;background-position:center}
#camui button{width:54px;height:54px;border-radius:50%}
#pill{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;height:30px;z-index:8;display:none}
#pill::after{content:"";position:absolute;left:18px;right:18px;bottom:9px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);box-shadow:0 0 10px rgba(0,224,164,.6)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99}
</style>
</head>
<body>
<div id="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
<symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.5 6.5a8 8 0 1011 0"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

<symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5M13.5 5l-3 14"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 18l5-5 4 4 2-2 4 4"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6zM9 11h6M9 15h6"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-flip" viewBox="0 0 24 24"><path d="M4 8h12l-3-3M20 16H8l3 3"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v7h14v-7"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4M5 20h14"/></symbol>
</defs></svg>
  <canvas id="rain"></canvas>
  <div id="three"></div>

  <section id="home" class="win">
    <div id="sb"><span id="sbt">--:--</span><span id="sbr"></span></div>
    <div id="wid" class="glass"><div id="wt">--:--</div><div id="wd"></div></div>
    <div id="grid"></div>
    <div id="dock" class="glass"></div>
  </section>
  <section id="ide" class="win">
    <div id="top"><div id="files"></div><button id="add"><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <div id="tools">
      <button id="run"><svg class="ic"><use href="#i-play"/></svg>Lancer</button>
      <button id="ren"><svg class="ic"><use href="#i-edit"/></svg></button>
      <button id="del"><svg class="ic"><use href="#i-trash"/></svg></button>
      <button id="bgbtn">Fond 2D</button>
      <button id="full"><svg class="ic"><use href="#i-full"/></svg></button>
      <button id="offl">Hors-ligne</button>
      <button id="lockbtn"><svg class="ic"><use href="#i-power"/></svg>Veille</button>
    </div>
    <div id="edwrap">
      <pre id="hl"></pre>
      <textarea id="ta" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
    <div id="keys"></div>
    <div id="out">
      <div id="otabs"><button id="tprev" class="on">Aperçu</button><button id="tcon">Console</button><button id="oclose" style="margin-left:auto"><svg class="ic"><use href="#i-close"/></svg></button></div>
      <iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
      <pre id="con"></pre>
    </div>
  </section>

  <div id="wins"></div>
  <div id="pill"></div>
  <div id="dim"></div>
  <section id="lock">
    <div id="lbat"></div>
    <div class="chip glass"><b></b>SYSTÈME ACTIF</div>
    <div id="ldate"></div>
    <div id="ltime"><span id="lh">--</span><span id="lm">--</span></div>
    <div class="notif glass"><b>MNL OS</b><span>Système prêt.</span></div>
    <div class="lbottom"><div class="lrow"><span class="gb"><svg class="ic"><use href="#i-torch"/></svg></span><span class="gb"><svg class="ic"><use href="#i-cam"/></svg></span></div><span class="hint">Glisse vers le haut pour ouvrir</span><i></i></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

/* ===================== FICHIERS ===================== */
const DEF={
'index.html':`<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mon site à Kinshasa</title>
  <style>
    body{font-family:sans-serif;text-align:center;padding:40px;background:#0b1522;color:#fff}
    button{padding:12px 20px;font-size:16px;border:0;border-radius:10px;background:#00e0a4}
  </style>
</head>
<body>
  <h1>Bienvenue !</h1>
  <p>Je crée des sites web et des PWA.</p>
  <button onclick="salut()">Contactez-moi</button>
  <script>
    function salut(){
      console.log("Clic reçu !");
      alert("Bonjour depuis Kinshasa !");
    }
  <\/script>
</body>
</html>`,
'main.py':`# Ma première fonction Python
def saluer(nom):
    return "Salut, " + nom + " !"

print("Bonjour Kinshasa !")
print(saluer("Manasse"))

for i in range(3):
    print("Partie", i + 1)
`};
let files; try{files=JSON.parse(LS('mnl_files'))}catch(e){}
if(!files||!Object.keys(files).length)files={...DEF};
let active=LS('mnl_active'); if(!files[active])active=Object.keys(files)[0];
const save=()=>{LS('mnl_files',JSON.stringify(files));LS('mnl_active',active)};

const ta=$('ta'),hl=$('hl');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const sp=(c,t)=>`<span class="${c}">${esc(t)}</span>`;
const PYK='def|class|return|if|elif|else|for|while|in|import|from|as|try|except|finally|with|lambda|pass|break|continue|and|or|not|is|None|True|False|print|input|range|len|int|str|float|list|dict';
const JSK='const|let|var|function|return|if|else|for|while|class|new|import|export|true|false|null|undefined|async|await|document|console|alert';
function highlight(code,name){
  const ext=(name.split('.').pop()||'').toLowerCase();
  let re,f;
  if(ext==='py'){re=new RegExp(`(#.*)|("""[\\s\\S]*?"""|'''[\\s\\S]*?'''|"(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*')|\\b(${PYK})\\b|\\b(\\d+\\.?\\d*)\\b`,'g');
    f=m=>m[1]?sp('c',m[1]):m[2]?sp('s',m[2]):m[3]?sp('k',m[3]):sp('n',m[4]);}
  else if(ext==='js'||ext==='css'||ext==='json'){re=new RegExp(`(\\/\\/.*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*'|\`(?:\\\\.|[^\`\\\\])*\`)|\\b(${JSK})\\b|\\b(\\d+\\.?\\d*)\\b`,'g');
    f=m=>m[1]?sp('c',m[1]):m[2]?sp('s',m[2]):m[3]?sp('k',m[3]):sp('n',m[4]);}

async function renderGal(){
  gurls.forEach(u=>URL.revokeObjectURL(u));gurls=[];GB.innerHTML='';
  const bar=el('div','bar'),inp=el('input');inp.type='file';inp.accept='image/*,video/*';inp.multiple=true;inp.hidden=true;
  inp.onchange=async()=>{for(const f of inp.files)await dbAdd({blob:f,type:f.type||'image/jpeg',t:Date.now()});renderGal()};
  bar.append(bt(ico('plus')+'Importer',()=>inp.click()),inp);GB.appendChild(bar);
  let all=[];try{all=(await dbAll())||[]}catch(e){}
  all.reverse();
  if(!all.length){GB.appendChild(el('div','empty','Aucune photo.<br>Prends-en avec l’app Photo.'));return}
  const g=el('div','gg');
  all.forEach(m=>{const u=URL.createObjectURL(m.blob);gurls.push(u);const v=m.type.startsWith('video'),t=el(v?'video':'img');t.src=u;if(v)t.muted=true;t.onclick=()=>viewMedia(m,u,v);g.appendChild(t)});
  GB.appendChild(g);
}
function viewMedia(m,u,v){
  GV.innerHTML='';GV.style.display='flex';
  const x=el(v?'video':'img');x.src=u;if(v)x.controls=true;
  const ext=(m.type.split('/')[1]||'jpg').replace('jpeg','jpg'),nm='mnl-'+m.id+'.'+ext,bar=el('div','bar');
  bar.append(bt(ico('back'),()=>GV.style.display='none'),
    bt(ico('download'),()=>{const a=el('a');a.href=u;a.download=nm;a.click()}),
    bt(ico('share'),async()=>{try{await navigator.share({files:[new File([m.blob],nm,{type:m.type})]})}catch(e){}}),
    bt(ico('trash'),async()=>{if(confirm('Supprimer ?')){await dbDel(m.id);GV.style.display='none';renderGal()}}));
  GV.append(bar,x);
}
OPEN.gal=renderGal;CLOSE.gal=()=>{GV.style.display='none'};

/* ---- Notes ---- */
const NB=mkWin('note','Notes');
let notes=[];try{notes=JSON.parse(LS('mnl_notes'))||[]}catch(e){}
let nid=null;const saveN=()=>LS('mnl_notes',JSON.stringify(notes));
function renderNotes(){
  NB.innerHTML='';
  if(nid===null){
    const bar=el('div','bar');bar.append(bt(ico('plus')+'Nouvelle note',()=>{notes.unshift({id:Date.now(),t:''});nid=notes[0].id;saveN();renderNotes()}));NB.appendChild(bar);
    if(!notes.length)NB.appendChild(el('div','empty','Aucune note.'));
    notes.forEach(n=>{const r=el('div','row glass',`<span>${esc((n.t.split('\n')[0]||'Note vide').slice(0,40))}<small>${new Date(n.id).toLocaleDateString('fr-FR')}</small></span>`);r.onclick=()=>{nid=n.id;renderNotes()};NB.appendChild(r)});
  }else{
    const n=notes.find(x=>x.id===nid)||{t:''},bar=el('div','bar'),t=el('textarea','nt');
    bar.append(bt('Liste',()=>{nid=null;renderNotes()}),bt(ico('trash'),()=>{notes=notes.filter(x=>x.id!==nid);nid=null;saveN();renderNotes()}));
    t.value=n.t;t.oninput=()=>{n.t=t.value;saveN()};NB.append(bar,t);
  }
}
OPEN.note=()=>{nid=null;renderNotes()};

/* ---- Calculatrice ---- */
const KB=mkWin('calc','Calcul');
KB.innerHTML='<div class="big" id="cd">0</div><div class="ck" id="ck"></div>';
let ce='';
['C','(',')','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].forEach(k=>{
  $('ck').appendChild(bt(k,()=>{
    if(k==='C')ce='';
    else if(k==='⌫')ce=ce.slice(0,-1);
    else if(k==='='){try{const e=ce.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');if(!/^[0-9+\-*\/().\s]+$/.test(e))throw 0;ce=String(+Function('"use strict";return('+e+')')().toFixed(10))}catch(x){ce='Erreur'}}
    else{if(ce==='Erreur')ce='';ce+=k}
    $('cd').textContent=ce||'0';
  },k==='='?'eq':''));
});

/* ---- Horloge ---- */
const TB=mkWin('clk','Horloge');
TB.innerHTML='<div class="big" id="cbt">00:00.0</div><div class="bar"><button id="cgo">Démarrer</button><button id="crs">Zéro</button></div><div class="sec">MINUTEUR</div><div class="row glass"><span>Minutes</span><input id="tmin" type="number" min="1" value="5"></div><div class="bar"><button id="tgo">Lancer</button></div><div class="big" id="tout">--:--</div>';
let cs=0,cacc=0,cint=null,tint=null;
const fmt=ms=>{const s=ms/1000;return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};
$('cgo').onclick=()=>{if(cint){clearInterval(cint);cint=null;cacc+=Date.now()-cs;$('cgo').textContent='Reprendre'}else{cs=Date.now();cint=setInterval(()=>{$('cbt').textContent=fmt(cacc+Date.now()-cs)},80);$('cgo').textContent='Pause'}};
$('crs').onclick=()=>{clearInterval(cint);cint=null;cacc=0;$('cbt').textContent='00:00.0';$('cgo').textContent='Démarrer'};
function beep(){try{navigator.vibrate&&navigator.vibrate([300,150,300]);const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},700)}catch(e){}}
$('tgo').onclick=()=>{clearInterval(tint);const end=Date.now()+(+$('tmin').value||1)*60000;tint=setInterval(()=>{const r=end-Date.now();if(r<=0){clearInterval(tint);$('tout').textContent='00:00';beep();return}const s=Math.ceil(r/1000);$('tout').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)};

/* ---- Fichiers (projet de code) ---- */
const FB=mkWin('fil','Fichiers');
function renderFil(){
  FB.innerHTML='';
  const inp=el('input'),bar=el('div','bar');inp.type='file';inp.multiple=true;inp.hidden=true;
  inp.onchange=async()=>{for(const f of inp.files)files[f.name]=await f.text();save();ta.value=files[active];paint();renderFil()};
  bar.append(bt(ico('plus')+'Importer',()=>inp.click()),inp);
  FB.append(el('div','sec','PROJET CODE'),bar);
  Object.keys(files).forEach(n=>{
    const r=el('div','row glass',`<span>${esc(n)}<small>${new Blob([files[n]]).size} octets</small></span>`),b=el('div','bar');
    b.append(bt('Ouvrir',()=>{files[active]=ta.value;active=n;load();openApp('ide')}),
      bt(ico('download'),()=>{const u=URL.createObjectURL(new Blob([files[n]])),a=el('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}));
    r.append(b);FB.append(r);
  });
}
OPEN.fil=renderFil;

/* ---- Réglages ---- */
const SB=mkWin('set','Réglages');
const stopS=s=>s.getTracks().forEach(t=>t.stop());
const PERMS=[['camera','Caméra',()=>navigator.mediaDevices.getUserMedia({video:true}).then(stopS)],
 ['microphone','Micro',()=>navigator.mediaDevices.getUserMedia({audio:true}).then(stopS)],
 ['geolocation','Position',()=>new Promise((ok,ko)=>navigator.geolocation.getCurrentPosition(ok,ko,{timeout:15000}))],
 ['notifications','Notifications',()=>Notification.requestPermission()]];
const PFR={granted:'Autorisé',denied:'Refusé',prompt:'À demander'};
async function renderSet(){
  const b=document.createDocumentFragment();
  const sec=t=>b.appendChild(el('div','sec',t));
  const row=(l,c,sub)=>{const r=el('div','row glass',`<span>${l}${sub?`<small>${sub}</small>`:''}</span>`);if(c)r.append(c);b.appendChild(r)};
  const rng=(mn,mx,v,f)=>{const x=el('input');x.type='range';x.min=mn;x.max=mx;x.value=v;x.oninput=()=>f(+x.value);return x};
  const seg=(opts,cur,f)=>{const s=el('div','seg');opts.forEach(([k,t])=>s.appendChild(bt(t,()=>{f(k);renderSet()},k===cur?'on':'')));return s};
  sec('AFFICHAGE');
  row('Fond animé',seg([['3d','3D'],['2d','2D']],bg,k=>setBg(k)));
  row('Densité des chiffres',rng(5,100,DENS*100,v=>{DENS=v/100;LS('mnl_dens',DENS)}));
  row('Vitesse de chute',rng(10,200,SPD*100,v=>{SPD=v/100;LS('mnl_spd',SPD)}));
  row('Luminosité',rng(20,100,BRI,v=>{BRI=v;LS('mnl_bri',v);dimv()}));
  const aw=LS('mnl_awake')!=='0';
  row('Écran toujours allumé',seg([['1','Oui'],['0','Non']],aw?'1':'0',k=>{LS('mnl_awake',k);if(k==='1')wake();else if(wl){wl.release();wl=null}}),'Pendant que l’OS est ouvert');
  row('Plein écran',bt('Basculer',()=>$('full').click()));
  sec('AUTORISATIONS');
  for(const [n,l,f] of PERMS){
    let st='?';try{st=(await navigator.permissions.query({name:n})).state}catch(e){}
    row(l,bt('Autoriser',async()=>{try{await f()}catch(e){}renderSet()}),PFR[st]||'Inconnu');
  }
  sec('STOCKAGE');
  let est={},per=false;try{est=await navigator.storage.estimate();per=await navigator.storage.persisted()}catch(e){}
  const mb=n=>n?(n/1048576).toFixed(1)+' Mo':'?';
  row('Espace utilisé',null,mb(est.usage)+' sur '+mb(est.quota));
  row('Protéger les données',bt('Activer',async()=>{try{await navigator.storage.persist()}catch(e){}renderSet()}),per?'Protégé':'Non protégé');
  row('Hors-ligne (Python)',bt('Télécharger',()=>$('offl').click()));
  sec('SYSTÈME');
  let bat='?';try{const x=await navigator.getBattery();bat=Math.round(x.level*100)+'%'+(x.charging?' (en charge)':'')}catch(e){}
  const cn=navigator.connection;
  row('Batterie',null,bat);
  row('Réseau',null,navigator.onLine?(cn&&cn.effectiveType?cn.effectiveType.toUpperCase():'En ligne'):'Hors ligne');
  row('Écran',null,innerWidth+' x '+innerHeight+' @'+(devicePixelRatio||1)+'x');
  row('Processeur / RAM',null,(navigator.hardwareConcurrency||'?')+' cœurs / '+(navigator.deviceMemory||'?')+' Go');
  sec('À PROPOS');
  row('MNL OS',null,'Version 0.1 par MANASSE MNL');
  row('Réinitialiser',bt('Effacer tout',async()=>{
    if(!confirm('Effacer fichiers, photos et réglages ?'))return;
    try{(await DB).close()}catch(e){}
    localStorage.clear();indexedDB.deleteDatabase('mnl_os');
    try{for(const k of await caches.keys())await caches.delete(k)}catch(e){}
    location.reload();
  }));
  SB.replaceChildren(b);
}
OPEN.set=renderSet;

addEventListener('pointerdown',()=>{if(!document.fullscreenElement)goFull()},{once:true});
load();setBg(bg);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
